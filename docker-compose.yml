version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: vocalsync_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VOICE_PROFILES_DIR=/app/voice_profiles
      - ASR_MODEL_SIZE=small.en
    volumes:
      - ./backend/voice_profiles:/app/voice_profiles
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws/meeting}
    container_name: vocalsync_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
